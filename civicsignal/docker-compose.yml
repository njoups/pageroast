# Local stack for a laptop: Postgres, Redis (BullMQ), API, worker, web, a Caddy edge proxy and Mailpit (a local inbox
# that catches every email the app sends). Quick start: scripts/local-up.sh (macOS/Linux) or scripts/local-up.ps1
# (Windows); guide: docs/LOCAL_SETUP.md. Staging and production use infra/compose.production.yml instead.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: civicsignal_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: civicsignal
    ports: ["127.0.0.1:${DB_HOST_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicsignal_owner -d civicsignal"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      retries: 20

  migrate:
    # Same image as the API; migrations run with plain node, as in production.
    image: civicsignal-api:local
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "apps/api/dist/database/migrate-cli.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://civicsignal_owner:${POSTGRES_PASSWORD}@db:5432/civicsignal
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    depends_on: { db: { condition: service_healthy } }

  api:
    image: civicsignal-api:local
    build: { context: ., dockerfile: apps/api/Dockerfile }
    init: true
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://civicsignal_app:${APP_DB_PASSWORD}@db:5432/civicsignal
      # The owner (migration) credentials are given only to the migrate job, never to long-running services.
      APP_ENV: ${APP_ENV:-local}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3000}
      # Browsers accept Secure cookies on http://localhost; use HTTPS everywhere else.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      # Only valid because the edge proxy below overwrites X-Forwarded-For. Never expose web or api directly.
      TRUST_PROXY: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # AI analysis (docs/AI_PROVIDERS.md). Without a key the rule-based baseline is used and labelled as such.
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_FALLBACK: ${AI_FALLBACK:-baseline}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-smtp://mail:1025}
      EMAIL_FROM: ${EMAIL_FROM:-civicsignal@localhost.test}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }

  worker:
    image: civicsignal-api:local
    build: { context: ., dockerfile: apps/api/Dockerfile }
    init: true
    command: ["node", "apps/api/dist/worker.js"]
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "node", "apps/api/dist/worker-health.js"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgres://civicsignal_app:${APP_DB_PASSWORD}@db:5432/civicsignal
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      INGESTION_USER_AGENT: ${INGESTION_USER_AGENT:-CivicSignalBot/0.2 (+contact your operator)}
      # The worker runs analysis and sends notifications, so it needs the same AI and channel settings as the API.
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_FALLBACK: ${AI_FALLBACK:-baseline}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-smtp://mail:1025}
      EMAIL_FROM: ${EMAIL_FROM:-civicsignal@localhost.test}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }

  web:
    image: civicsignal-web:local
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { API_INTERNAL_URL: http://api:4000 } }
    init: true
    depends_on: { api: { condition: service_healthy } }

  edge:
    image: caddy:2
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: { web: { condition: service_healthy } }
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3000}:8080"]

  # Local inbox: every email (alerts, reports, password reset) lands here instead of a real mailbox.
  # Open http://localhost:8025. Set SMTP_URL in .env to use a real relay instead.
  mail:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ["127.0.0.1:${MAIL_HOST_PORT:-8025}:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      retries: 10

volumes:
  pgdata:
  redisdata:
