# Example Prometheus configuration for a CivicSignal environment (docs/DEPLOYMENT.md, "Observability").
# Runs INSIDE the private network: /metrics is never routed through the public edge.
# Validate: promtool check config infra/monitoring/prometheus.example.yml
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels: { environment: production }   # or staging: one Prometheus (or label set) per environment

rule_files: [alerts.yml]

scrape_configs:
  - job_name: civicsignal-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      # METRICS_TOKEN from the environment's secret manager, written to a 0400 file; never inline it here.
      credentials_file: /etc/prometheus/secrets/civicsignal_metrics_token
    static_configs:
      - targets: ['api:4000']          # the API containers' private address(es)

  # Public end-to-end readiness and certificate expiry, via the blackbox exporter (module http_2xx).
  - job_name: civicsignal-readyz
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ['https://<your-domain>/readyz']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Host CPU, memory, disk and the backup textfile metric (scripts/backup.sh → BACKUP_METRICS_FILE).
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
