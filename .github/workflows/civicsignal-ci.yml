name: civicsignal-ci

on:
  push:
    paths: ['civicsignal/**', '.github/workflows/civicsignal-ci.yml']
  pull_request:
    paths: ['civicsignal/**', '.github/workflows/civicsignal-ci.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: civicsignal

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: civicsignal/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests (unit, migrations, RLS, e2e against Postgres 16)
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
